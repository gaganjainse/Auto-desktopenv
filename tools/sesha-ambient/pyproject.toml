[project]
name = "sesha-ambient"
version = "0.1.0"
description = "Sesha: catch-up scheduler, do-not-disturb policy, and warm proactivity for a laptop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = []

[project.scripts]
sesha-ambient = "sesha_ambient.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "I"]
ignore = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
