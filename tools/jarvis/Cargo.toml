[package]
name = "sm-watcher"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"

[dependencies]
notify      = "6.1"          # inotify watcher — verify latest at crates.io/crates/notify
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
toml        = "0.8"
dirs        = "5"            # platform dirs (home, downloads, desktop)
# Hyprland IPC for future Rust-native Hyprland control:
hyprland    = "0.3.13"       # hyprland-rs crate