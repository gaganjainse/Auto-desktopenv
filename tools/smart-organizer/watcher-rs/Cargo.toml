[package]
name = "sm-watcher"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Real-time, debounced inotify watcher for the Shesha smart-organizer"

[[bin]]
name = "sm-watcher"
path = "src/main.rs"

[dependencies]
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
