# Smart Organizer Configuration
# This file is sourced by smart-organizer.sh to override default settings

# Age thresholds (in days)
CACHE_MAX_AGE=30
TRASH_MAX_AGE=30
OLD_INSTALLER_MAX_AGE=90
TEMP_MAX_AGE=7
DOWNLOADS_PROMOTION_AGE=30
OLD_MEDIA_AGE=180
BUILD_ARTIFACT_MAX_AGE=30

# File size thresholds (in MB)
LARGE_FILE_THRESHOLD_MB=1024
DUPLICATE_CHECK_SIZE=10

# Cleanup settings
CLEAN_CACHE=true
CLEAN_TRASH=true
CLEAN_BLOAT=true
CLEAN_BUILD_ARTIFACTS=true
CLEAN_OLD_MEDIA=true
CLEAN_DUPLICATES=true
REPORT_LARGE_FILES=true
CONFIRM_DELETE=true

# Organization settings
ORGANIZE_DOWNLOADS=true
ORGANIZE_DOCUMENTS=true
ORGANIZE_PICTURES=true
ORGANIZE_VIDEOS=true
ORGANIZE_MUSIC=true
PROMOTE_DOWNLOADS=true

# Folder operations
MERGE_FOLDERS=true
SPLIT_FOLDERS=true
DEDUPE_FOLDERS=true

# Protected paths (never touch these)
PROTECTED_PATHS=(
    "$HOME/.ssh"
    "$HOME/.gnupg"
    "$HOME/.password-store"
    "$HOME/.aws"
    "$HOME/.docker"
    "$HOME/.kube"
    "$HOME/.config/git"
    "$HOME/.config/nvim"
    "$HOME/.config/hypr"
    "$HOME/.config/fish"
    "$HOME/.config/quickshell"
    "$HOME/.config/ags"
    "$HOME/.config/waybar"
    "$HOME/Workspace"
    "$HOME/Projects"
    "$HOME/Models"
    "$HOME/Datasets"
    "$HOME/AI"
    "$HOME/bin"
    "$HOME/.local/bin"
    "$HOME/.local/share/fonts"
    "/etc"
    "/usr"
    "/var"
    "/boot"
    "/root"
)

# Protected file patterns
PROTECTED_PATTERNS=(
    "*.key"
    "*.pem"
    "*.secret"
    "*.password"
    "*credentials*"
    "*id_rsa*"
    "*id_ed25519*"
    "*.p12"
    "*.pfx"
    "*backup*"
    "*password*"
    "*credentials*"
)
