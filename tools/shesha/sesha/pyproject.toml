[project]
name = "shesha-tools"
version = "0.1.0"
description = "Shesha Soma MCP servers and classifier (system, shell, files)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]

dependencies = [
  "mcp[cli]>=1.0",
  "fastmcp>=0.1",
  "httpx>=0.27",
  "pydantic>=2.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
ai = [
  "chromadb>=1.5.9",
  "faster-whisper>=1.2.0",
  "piper-tts",
]
watcher = [
  "watchfiles>=0.24",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.uv]
# Keep the lock cross-platform; these tools run on Linux only at runtime.
environments = [
  "sys_platform == 'linux'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "I"]
ignore = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
