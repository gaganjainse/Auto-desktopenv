name: Python Check

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'sdata/subcmd-smart-organizer/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'sdata/subcmd-smart-organizer/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-flake8
      - name: Check Python syntax
        run: |
          set -euo pipefail
          echo "Finding Python files..."
          python_files=$(find tools sdata/subcmd-smart-organizer -type f -name '*.py' 2>/dev/null | sort)
          echo "Found files: $python_files"

          if [[ -z "$python_files" ]]; then
            echo "No Python files found to check"
            exit 0
          fi

          exit_code=0
          for pyfile in $python_files; do
            echo "Checking syntax: $pyfile"
            if ! python3 -m py_compile "$pyfile"; then
              echo "FAILED: $pyfile"
              exit_code=1
            fi
          done

          if [[ $exit_code -eq 0 ]]; then
            echo "All Python files have valid syntax"
          else
            echo "Some Python files have syntax errors"
            exit 1
          fi
      - name: Check Python style with flake8
        run: |
          set -euo pipefail
          echo "Finding Python files for linting..."
          python_files=$(find tools sdata/subcmd-smart-organizer -type f -name '*.py' 2>/dev/null | sort)
          echo "Found files: $python_files"

          if [[ -z "$python_files" ]]; then
            echo "No Python files found to lint"
            exit 0
          fi

          exit_code=0
          for pyfile in $python_files; do
            echo "Linting: $pyfile"
            if ! flake8 "$pyfile" --max-line-length=120 --ignore=E501,W503; then
              echo "FAILED: $pyfile"
              exit_code=1
            fi
          done

          if [[ $exit_code -eq 0 ]]; then
            echo "All Python files passed flake8"
          else
            echo "Some Python files failed flake8"
            exit 1
          fi
