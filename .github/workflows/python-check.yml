name: Python Check — all Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flake8 ruff

      - name: Check Python syntax py_compile all .py
        run: |
          set -euo pipefail
          echo "Finding all Python files..."
          python_files=$(find tools sdata -type f -name '*.py' 2>/dev/null | sort)
          echo "Found $(echo "$python_files" | wc -l) files"
          for pyfile in $python_files; do
            echo "Checking syntax: $pyfile"
            python3 -m py_compile "$pyfile"
          done
          echo "All Python syntax OK"

      - name: Ruff + flake8
        # Hard gates since 2026-08-13: previously `|| true`'d away, which let
        # 26 lint findings (incl. two real glxinfo pipe bugs) accumulate
        # invisibly. Debt cleared; these commands now decide the build.
        run: |
          echo "Running ruff..."
          ruff check tools/ sdata/
          echo "Running flake8..."
          flake8 tools/ sdata/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Cargo check for watcher-rs
        run: |
          if [ -d "tools/smart-organizer/watcher-rs" ]; then
            echo "Found watcher-rs, running cargo check..."
            cd tools/smart-organizer/watcher-rs
            if command -v cargo >/dev/null 2>&1; then
              cargo check || echo "cargo check failed, but continuing (Rust toolchain may not be installed in Ubuntu, CI has Rust in Arch container)"
            else
              echo "cargo not found, skipping (will be checked in arch-test container)"
            fi
          else
            echo "No watcher-rs dir, skipping cargo check"
          fi
