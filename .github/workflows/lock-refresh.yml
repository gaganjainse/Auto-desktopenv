name: Refresh Python lock (sdata/uv)

# The uv requirements lock is security-relevant (stale pillow/cryptography
# pins are how the 2026-08 dependabot security runs kept failing), but it
# can only be compiled where dbus/cairo/gobject system headers exist — not
# in a bare sandbox. This workflow is that environment: it recompiles the
# lock from requirements.in on a hosted runner and commits the result to
# main only after a full dry-run resolution passes. Rolling-release as
# designed: latest compatible versions, monthly cadence, zero hand-edits.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"  # monthly, 1st, 04:17 UTC

permissions:
  contents: write  # commits the refreshed lock; nothing else
  pull-requests: none

concurrency:
  group: lock-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: System headers for metadata builds (dbus/cairo/gobject)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libcairo2-dev libgirepository-2.0-dev pkg-config \
            libwayland-dev wayland-protocols gobject-introspection \
            libglib2.0-dev  # girepository-2.0.pc: pygobject metadata build requires it

      - name: Recompile the lock from requirements.in (all latest compatible)
        run: |
          python -m pip install --upgrade pip pip-tools
          cd sdata/uv
          pip-compile --upgrade --resolver=backtracking \
            -o requirements.txt requirements.in

      - name: Dry-run resolution must pass or nothing lands
        run: |
          cd sdata/uv
          python -m pip install --dry-run --quiet -r requirements.txt

      - name: Commit if the lock actually changed
        run: |
          cd sdata/uv
          if git diff --quiet requirements.txt; then
            echo "lock already current — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "deps: refresh sdata/uv lock (monthly rolling recompile)

          Compiled from requirements.in on ubuntu-latest py3.13 with system
          headers; dry-run resolution passed before commit."
          git push
