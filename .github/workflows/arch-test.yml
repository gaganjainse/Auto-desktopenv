name: Arch Container Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4  # v4

      - name: Install deps in Arch container
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git bash shellcheck python python-pip
          bash --version
          shellcheck --version
          python3 --version

      - name: bash -n all scripts
        run: |
          set -euo pipefail
          echo "Running bash -n on all .sh plus setup, diagnose, test.sh..."
          find . -type f \( -name '*.sh' -o -name 'setup' -o -name 'diagnose' -o -name 'test.sh' \) ! -path "./dots/*" ! -path "./.git/*" -exec bash -n {} \; && echo "bash -n OK"

      # Deliberately no shellcheck step: it ran with `|| true` here for months,
      # which only LOOKED like coverage. The desktop scripts have a known
      # finding backlog (141 findings at -S warning on 2026-08-12) tracked in
      # TODO.md; the bash -n syntax gate above stays a hard gate. When the
      # backlog is cleared this step returns as a hard gate.
      - name: shellcheck (report-only until backlog clears — see TODO.md)
        continue-on-error: false
        run: |
          mapfile -t SHF < <(find . -type f -name '*.sh' ! -path "./dots/*" ! -path "./.git/*" | head -n 50)
          shellcheck -x -s bash -S warning "${SHF[@]}" | tee /tmp/sc.log
          echo "SHELLCHECK_FINDINGS=$(grep -cE 'SC[0-9]{4}' /tmp/sc.log || echo 0)" >> "$GITHUB_ENV"
          if [ "${SHELLCHECK_FINDINGS:-1}" != "0" ]; then
            echo "::warning::shellcheck reports $SHELLCHECK_FINDINGS findings — tracked in TODO.md, hard gate lands when cleared"
          fi

      - name: Dry-run setup --help
        run: |
          chmod +x setup diagnose test.sh
          # --help must succeed. Masking the exit code here meant a script
          # that failed to parse still reported a green run.
          ./setup --help
          ./diagnose --help
