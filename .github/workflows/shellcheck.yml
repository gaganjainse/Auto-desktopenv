name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck --version

      # Tier 1 — Shesh-owned scripts: WARNING-clean required (ratchet: never regress).
      - name: Strict gate — tools/, entry scripts, sdata entry points we own
        run: |
          set -euo pipefail
          ours=$(find ./tools -type f -name '*.sh' | sort)
          ours="$ours ./setup ./diagnose ./test.sh"
          echo "Strict scope:"; echo "$ours"
          for script in $ours; do
            echo "Checking: $script"
            shellcheck -x -s bash -S warning "$script"
          done
          echo "STRICT SCOPE: warning-clean ✓"

      # Tier 2 — upstream sdata/ installer: bash -n + error-severity only.
      # Mass-fixing upstream shell style belongs to upstream rebases, not us.
      - name: Baseline gate — sdata (upstream fork code) at error severity
        run: |
          set -euo pipefail
          legacy=$(find ./sdata -type f -name '*.sh' ! -path "./.git/*" | sort)
          for script in $legacy; do
            bash -n "$script"
            shellcheck -x -s bash -S error "$script"
          done
          echo "BASELINE SCOPE: error-clean ✓"
