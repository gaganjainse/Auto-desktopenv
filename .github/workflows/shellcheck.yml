name: ShellCheck — all scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Run ShellCheck on all .sh plus setup, diagnose, test.sh (exclude dots/, .git/)
        run: |
          set -euo pipefail
          echo "Finding all shell scripts (all .sh + setup, diagnose, test.sh)..."
          # Find all .sh files plus setup, diagnose, test.sh, bootstrap.sh, excluding dots/ and .git/
          scripts=$(find . -type f \( -name '*.sh' -o -name 'setup' -o -name 'diagnose' -o -name 'test.sh' -o -name 'bootstrap.sh' \) ! -path "./dots/*" ! -path "./.git/*" ! -path "./screenshots/*" 2>/dev/null | sort)
          echo "Found $(echo "$scripts" | wc -l) scripts"
          echo "$scripts"

          exit_code=0
          for script in $scripts; do
            echo "Checking: $script"
            if ! shellcheck -x -s bash -S warning "$script"; then
              echo "FAILED: $script"
              exit_code=1
            fi
          done

          if [[ $exit_code -eq 0 ]]; then
            echo "All shell scripts passed ShellCheck at warning severity"
          else
            echo "Some scripts failed ShellCheck"
            exit 1
          fi
