name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'sdata/subcmd-smart-organizer/**'
      - 'tools/**/*.sh'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'sdata/subcmd-smart-organizer/**'
      - 'tools/**/*.sh'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

          # Find our bash scripts only
          scripts=$(find tools sdata/subcmd-smart-organizer -type f \( -name '*.sh' -o -name 'bootstrap.sh' \) | grep -v '.git' | sort)

          exit_code=0
          for script in $scripts; do
            echo "Checking: $script"
            shellcheck -x "$script" || exit_code=1
          done

          if [[ $exit_code -eq 0 ]]; then
            echo "All shell scripts passed ShellCheck"
          else
            echo "Some shell scripts failed ShellCheck"
            exit 1
          fi
