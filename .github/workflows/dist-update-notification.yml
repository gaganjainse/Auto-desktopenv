name: Comment on Discussion When sdata/dist-arch/ Changes

on:
  push:
    branches:
      - main
    paths:
      - "sdata/dist-arch/**"
      - "!sdata/dist-arch/README.md"
  workflow_dispatch:

jobs:
  comment_on_discussion:
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main'
    steps:
      - name: Create comment on discussion #2140
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_NUMBER: 2140
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          echo "Repository: ${REPO_OWNER}/${REPO_NAME}"

          if [[ "${REPO_OWNER}/${REPO_NAME}" != "end-4/dots-hyprland" ]]; then
            echo "Not upstream dots-hyprland. Skipping discussion notification."
            echo "This workflow is configured to only notify on the upstream repository."
            exit 0
          fi

          MESSAGE="**Auto notification:**\n"
          MESSAGE+="Directory \`sdata/dist-arch\` has been updated.\n"
          MESSAGE+="Commit HASH: ${{ github.sha }}\n"
          MESSAGE+="Commit message: ${{ github.event.head_commit.message }}"

          DISCUSSION_NODE_ID=$(gh api graphql -f query='
            query {
              repository( owner: "'${REPO_OWNER}'", name: "'${REPO_NAME}'" )
                { discussion(number: '${DISCUSSION_NUMBER}') { id } } 
              }' | \
            jq -r '.data.repository.discussion.id // empty')

          if [[ -z "$DISCUSSION_NODE_ID" ]]; then
            echo "Discussion #${DISCUSSION_NUMBER} not found. Skipping."
            exit 0
          fi

          gh api graphql -f query='
            mutation {
              addDiscussionComment(input:{
                discussionId: "'$DISCUSSION_NODE_ID'",
                body: "'"$MESSAGE"'",
              }) {
                clientMutationId
                comment {
                  id
                  body
                }
              }
            }
          '
