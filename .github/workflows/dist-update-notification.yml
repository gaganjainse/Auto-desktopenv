name: dist-update-notification

on:
  push:
    branches: [main]
    paths:
      - "sdata/dist-arch/**"

permissions:
  discussions: write

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create comment on discussion #2140
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_NUMBER: 2140
          # All github.* fields flow through env — never inline in the
          # script (actionlint expression injection; head_commit.message is
          # attacker-controlled text).
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          echo "Repository: ${REPO_OWNER}/${REPO_NAME}"

          if [[ "${REPO_OWNER}/${REPO_NAME}" != "end-4/dots-hyprland" ]]; then
            echo "Not upstream dots-hyprland. Skipping discussion notification."
            echo "This workflow is configured to only notify on the upstream repository."
            exit 0
          fi

          MESSAGE="**Auto notification:**\n"
          MESSAGE+="Directory \`sdata/dist-arch\` has been updated.\n"
          MESSAGE+="Commit HASH: ${HEAD_SHA}\n"
          MESSAGE+="Commit message: ${HEAD_MESSAGE}"

          # GraphQL documents travel as single-quoted heredoc bodies: no
          # shell expansion, no fragile quote-nesting for linters.
          QUERY=$(cat <<'GRAPHQL'
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              discussion(number: $number) { id }
            }
          }
          GRAPHQL
          )

          DISCUSSION_NODE_ID=$(gh api graphql \
            -f query="$QUERY" \
            -F owner="$REPO_OWNER" -F name="$REPO_NAME" -F number="$DISCUSSION_NUMBER" \
            | jq -r '.data.repository.discussion.id // empty')

          if [[ -z "$DISCUSSION_NODE_ID" ]]; then
            echo "Discussion #${DISCUSSION_NUMBER} not found. Skipping."
            exit 0
          fi

          MUTATION=$(cat <<'GRAPHQL'
          mutation($discussionId: ID!, $body: String!) {
            addDiscussionComment(input: {
              discussionId: $discussionId,
              body: $body,
            }) {
              clientMutationId
              comment { id body }
            }
          }
          GRAPHQL
          )

          gh api graphql \
            -f query="$MUTATION" \
            -F discussionId="$DISCUSSION_NODE_ID" -F body="$MESSAGE"

          echo "Notification comment posted to discussion #${DISCUSSION_NUMBER}."
