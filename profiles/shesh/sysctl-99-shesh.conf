# /etc/sysctl.d/99-shesh.conf
# MSI Sword 16 HX B14VEKG tuning — 16GB RAM, NVMe, hybrid GPU.
# See docs/SHESH/04_DEVICE_PROFILE.md

# Prefer zram (compressed swap) over retaining cold pages in RAM. With a zram
# swap device, a high swappiness makes the kernel favor compression, enlarging
# effective memory instead of discarding it. Matches the live zram-generator.conf.
vm.swappiness = 150

# zram-specific reclaim tuning (Pop!_OS / ArchWiki). Disable the watermark boost
# that would otherwise wake kswapd early and churn compressed pages; widen the
# watermark scale so reclaim stays proportional; cluster=0 avoids readahead of
# swap pages (zram is random-access, not a spindle).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

vm.dirty_ratio = 5
vm.dirty_background_ratio = 2

# Network: cake queueing discipline + BBR congestion control.
net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr

# Slightly more inotify watches (large projects / organizer).
fs.inotify.max_user_watches = 524288
