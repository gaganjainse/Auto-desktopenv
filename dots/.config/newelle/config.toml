# Newelle 1.4.5 configuration for Shesha (native install, not Flatpak).
# Native install is required for STDIO MCP + microphone + filesystem access.
# See docs/SHESHA/06_SHESHA_AGENT.md

[model]
provider = "ollama"
model = "phi4-mini"
ollama_url = "http://localhost:11434"

[voice]
enabled = true
wake_word = "hey sesha"
stt_backend = "faster_whisper"
stt_model = "base.en"          # ~145MB; English, fast. Use "small.en" if CPU allows.
tts_backend = "piper"
tts_voice = "en_US-ryan-high"

[memory]
enabled = true
embedding_model = "nomic-embed-text"

[permissions]
# Newelle 1.3.5+ file permissions
allow_read = [
  "~/Documents/Personal",
  "~/Downloads",
  "~/Notes",
  "~/Projects/personal",
]
allow_write = [
  "~/Downloads",
  "~/Documents/Inbox",
  "~/.local/share/sesha",
]
ask_before = ["~/"]
deny = [
  "~/Documents/Job",
  "~/Projects/job",
  "~/Vaults",
  "~/.ssh",
  "~/.gnupg",
]

# MCP servers — STDIO transport (Newelle 1.4.5 supports STDIO on native installs).
# The venv is created by setup_ai_stack; bin names are shesha-<name>-mcp.
[mcp.system_control]
command = "~/.local/state/shesha/.venv/bin/python"
args = ["~/.local/bin/shesha-system-control-mcp"]

[mcp.smart_organizer]
command = "~/.local/state/shesha/.venv/bin/python"
args = ["~/.local/bin/shesha-smart-organizer-mcp"]

[mcp.hyprland_control]
command = "~/.local/state/shesha/.venv/bin/python"
args = ["~/.local/bin/shesha-hyprland-control-mcp"]
